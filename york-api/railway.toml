# Second Railway service. Set the service root directory to york-api/.
# Do not add a start script to the repository root package.json.
# The static site keeps Railpack/Caddy from the root railway.toml.
#
# YORK_API_HOST belongs on the static site, not on this service.
# It is the address Caddy uses for /api/york/*. See ENV.md for every variable,
# the per-IP cap, the per-minute cap, the global daily ceiling, the in-flight
# cap, and the X-Real-IP trust rule.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/york/health"
