# Second Railway service. Set the service root directory to york-api/.
# Do not add a start script to the repository root package.json.
# The static site keeps Railpack/Caddy from the root railway.toml.
#
# YORK_API_HOST belongs on the static site, not on this service.
# It is the address Caddy uses for /api/york/*. See ENV.md.
# This service must have no public domain, TCP proxy, or other callers.
# X-Real-IP is trusted only when Caddy and the Railway edge are the only path in.
# The image pins Claude Code 2.1.295 and Cursor agent 2026.10.01-e373342.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/york/health"
