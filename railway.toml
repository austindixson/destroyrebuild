# Railway hosting for this Vite SPA.
#
# Railpack installs npm deps, runs `npm run build` (emits dist/ and
# dist/york-chiller/), then serves dist/ with Caddy. The Caddyfile falls
# unknown paths back to index.html so History API routes
# (/portfolio, /blog, /tutorials, …) work, and serves /york-chiller/ as
# its own app. Do not add a package.json "start" script — that disables
# Railpack SPA/Caddy.

[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
healthcheckPath = "/"
